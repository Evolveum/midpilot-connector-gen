[project]
name = "midpilot-connector-gen"
version = "0.1.0"
description = "Midpilot Connector Generator"
readme = "README.md"
requires-python = ">=3.13.4"
dependencies = [
    "fastapi>=0.139.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "colorlog>=6.11.0",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-openai>=1.3.5",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260518",
    "ddgs>=9.14.4",
    "crawl4ai>=0.9.2",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "markdownify>=1.2.3",
    "langchain-core>=1.4.9",
    "langsmith>=0.10.6",
    "langfuse>=4.14.1",
    "lxml-stubs>=0.5.1",
    "python-multipart>=0.0.32",
    "validators>=0.35.0",
    "requests>=2.34.2",
    "transformers>=5.14.1",
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.5",
    "psycopg2-binary>=2.9.12",
    "asyncpg>=0.31.0",
    "python-dotenv>=1.2.2",
    "groovy-parser>=0.2.2",
    "fuzzysearch>=0.8.1",
    "pypdf>=6.14.2",
    "beautifulsoup4>=4.15.0",
    "python-docx>=1.2.0",
    "hypercorn>=0.18.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.7.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "poethepoet>=0.48.0",
    "ruff>=0.15.22",
    "pre-commit>=4.6.0",
    "pytest-watcher>=0.6.3",
    "requests>=2.34.2",
    "types-requests>=2.33.0.20260712",
    "types-urllib3>=1.26.25.14",
]

# until uv implements task runner we use poethepoet
# https://github.com/astral-sh/uv/issues/5903
[tool.poe.tasks]
start.cmd = "server.py"
start.envfile = ".env"
test.cmd = "pytest"
test.envfile = ".env.test"
test-watch.cmd = "ptw ."
test-watch.envfile = ".env.test"
# we must ignore clearml directory in typecheck because it does have separate dependencies
# that we dont want unless we are specifically using clearml
typecheck = "mypy . --exclude=.venv --exclude=clearml"
stylecheck = "ruff format --diff"
lint = "ruff check"
fix = [
  { cmd = "ruff check  --fix" },
  { cmd = "ruff format" },
]
qa = ["typecheck", "lint", "stylecheck", "test test/unit"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.13"
plugins = ['pydantic.mypy']
files = ["src", "test"]
explicit_package_bases = true

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["test"]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"
